<body><main class="wrap" id="app"></main>
<script>window.P={"id": 63, "emoji": "🚌", "title": "Free RTC Bus Travel Route Planner for Women", "title_te": "మహిళలకు ఉచిత ఆర్టీసీ బస్సు ప్రయాణ మార్గ ప్లానర్", "problem": "Village women want to use the free RTC bus scheme to visit hospitals and markets, but they get confused about connecting bus timings.", "idea": "A simple travel planner. It shows the steps to plan a trip with a connecting bus, and a calculator shows how much money the free Mahalakshmi bus travel saves Amma every month.", "widgets": [{"type": "steps", "heading": "🗺️ Plan a Trip with a Connecting Bus", "items": [{"title": "Write the trip", "text": "Write: from our village → town bus stand → hospital or market.", "te": "రాయండి: మా ఊరు → పట్టణ బస్టాండ్ → ఆసుపత్రి లేదా మార్కెట్."}, {"title": "Ask the timings", "text": "Ask the conductor or bus stand enquiry counter for first and last bus times. Write them down.", "te": "కండక్టర్ లేదా బస్టాండ్ ఎంక్వైరీలో మొదటి, చివరి బస్సు టైమింగ్స్ అడిగి రాసుకోండి."}, {"title": "Keep a gap", "text": "Keep at least 30 minutes gap between the first bus and the connecting bus.", "te": "మొదటి బస్సు, రెండో బస్సు మధ్య కనీసం 30 నిమిషాలు గ్యాప్ ఉంచండి."}, {"title": "Carry ID", "text": "Carry your Telangana identity card, like Aadhaar, to show the conductor for the free ticket.", "te": "ఉచిత టికెట్ కోసం ఆధార్ లాంటి తెలంగాణ గుర్తింపు కార్డు కండక్టర్‌కి చూపించండి."}, {"title": "Plan the return", "text": "Note the last bus back to the village. Start back early, before dark.", "te": "ఊరికి చివరి బస్సు టైమ్ గుర్తుంచుకోండి. చీకటి పడక ముందే తిరిగి బయలుదేరండి."}]}, {"type": "calculator", "heading": "💰 How Much Does the Free Bus Save Amma?", "intro": "Type the normal ticket price and how many trips Amma makes. (Which buses are free can change – please confirm with the RTC conductor or depot.)", "inputs": [{"id": "fare", "label": "Normal one-way ticket price (₹) – sample", "value": 40}, {"id": "trips", "label": "Return trips in a month", "value": 6}, {"id": "people", "label": "Number of women travelling", "value": 2}], "formula": "if (typeof fare !== 'number' || typeof trips !== 'number' || typeof people !== 'number' || fare < 0 || trips < 0 || people < 1) return null; var month = fare * 2 * trips * people; return {month: month, year: month * 12, level: 'good'};", "result": "Money saved in one month: ₹{month}\nMoney saved in one year: ₹{year}\nAmma can use this money for food, books or savings!"}], "tools": ["Gemini", "Canva"], "how": ["Ask elders and the bus conductor which buses go from our village to town, and note the timings in a notebook.", "Type the timings into Gemini and ask it to make a simple connecting-bus plan with 30-minute gaps.", "Check the plan once more with the bus stand enquiry counter, because timings change.", "Open Canva and pick a simple timetable or infographic template.", "Add big bus icons, times and place names in Telugu and English.", "Print it and stick it at the village bus stop and Anganwadi."], "prompt": "I am a Class 8 student. Here are the bus timings I collected: [paste timings]. Make a simple travel plan for a woman going from [my village] to [town hospital] using one connecting bus. Keep at least 30 minutes between buses and show the last bus back. Write it in simple Telugu and English as a short table.", "category": "Helping Mother, Sisters & Village Women"};</script><script src="../assets/app.js"></script></body></html>
