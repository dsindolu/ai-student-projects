<script>window.P={"id": 106, "emoji": "📅", "title": "Class 10 Board Exam Study Timetable Generator", "title_te": "పదో తరగతి పరీక్షల చదువు టైమ్‌టేబుల్ తయారీ", "problem": "My older hostel room senior stays awake till 2 AM crying with fear before Class 10 exams, because she cannot cover the huge science syllabus.", "idea": "A study timetable maker. Enter the days left and hours you can study, and it shares the hours between subjects, giving extra time to weak subjects.", "widgets": [{"type": "calculator", "heading": "🧮 Try it: Make my study plan", "intro": "Weak subjects get double time. Keep 1 day a week for rest and revision of mistakes.", "inputs": [{"id": "days", "label": "Days left before exams", "value": 60}, {"id": "hours", "label": "Study hours per day (outside class)", "value": 4}, {"id": "subjects", "label": "Number of subjects", "value": 6}, {"id": "weak", "label": "How many are weak subjects?", "value": 2}], "formula": "if (!(days > 0 && hours > 0 && subjects > 0 && weak >= 0 && weak <= subjects)) return null; var studyDays = Math.round(days * 6 / 7); var total = studyDays * hours; var share = total / (subjects + weak); var lvl = hours > 8 ? 'bad' : (hours > 6 ? 'warn' : 'good'); var msg = hours > 8 ? 'Too many hours! You need 8 hours of sleep to remember well.' : (hours > 6 ? 'That is a lot. Take short breaks every 45 minutes.' : 'Good balance. Sleep well too!'); return {studyDays: studyDays, total: Math.round(total), weakH: Math.round(share * 2), normalH: Math.round(share), weakDay: (share * 2 / studyDays * 60).toFixed(0), normalDay: (share / studyDays * 60).toFixed(0), msg: msg, level: lvl};", "result": "Study days (1 rest day a week): {studyDays}\nTotal study time: {total} hours\nEach weak subject: {weakH} hours (about {weakDay} minutes a day)\nEach other subject: {normalH} hours (about {normalDay} minutes a day)\n{msg}"}, {"type": "checklist", "heading": "✅ My healthy exam day", "intro": "Tick what you did today.", "items": [{"text": "Slept 7 to 8 hours", "te": "7–8 గంటలు నిద్రపోయాను"}, {"text": "Studied my weak subject first, when fresh", "te": "ముందుగా బలహీన సబ్జెక్టు చదివాను"}, {"text": "Took a 5-minute break every 45 minutes", "te": "ప్రతి 45 నిమిషాలకు 5 నిమిషాల విరామం"}, {"text": "Solved one old question paper section", "te": "పాత ప్రశ్నాపత్రంలో ఒక భాగం చేశాను"}, {"text": "Talked to a friend or teacher about my worries", "te": "నా భయాలు స్నేహితుడు/టీచర్‌తో పంచుకున్నాను"}, {"text": "Drank water and ate on time", "te": "సమయానికి తిన్నాను, నీళ్ళు తాగాను"}], "bands": [{"min": 0.8, "text": "Wonderful day! You are on track. 🌟", "level": "good"}, {"min": 0.5, "text": "Good effort. Try one more habit tomorrow.", "level": "warn"}, {"min": 0, "text": "It's okay. Start small tomorrow – sleep and one subject.", "level": "bad"}]}], "tools": ["Gemini", "Canva"], "how": ["Write down all subjects and mark the weak chapters with your senior.", "Count the days left before the exam.", "Ask Gemini to make a 60-day day-by-day revision plan, with extra time for weak topics and one rest day a week.", "Open Canva and choose a 'Daily planner' template.", "Put each day's subjects and chapters in the planner and print it.", "Tick each day when done and check the plan with your class teacher every week."], "prompt": "I am helping my Class 10 senior. Make a 60-day revision timetable for Telangana SSC exams with 6 subjects. Her weak subjects are Physical Science and Maths. She can study 4 hours a day after class. Keep one rest day each week and 8 hours of sleep.", "category": "Brothers, Sisters & Career Dreams"};</script><script src="../assets/app.js"></script></body></html>
