<script>window.P={"id": 26, "emoji": "📅", "title": "Checking Expiry Dates on Old Medicine Strips", "title_te": "పాత మందుల గడువు తేదీ చూసుకోవడం", "problem": "People keep half-used ointment tubes and tablet strips in tin boxes for years, using them without reading the tiny expired date stamps.", "idea": "An expiry checker. Google Lens reads the tiny date, and the checker shows a big red 'DO NOT USE' if it has passed. Here you can type the date from the strip.", "widgets": [{"type": "calculator", "heading": "🧮 Try it: Is this medicine expired?", "intro": "Find 'EXP' on the strip or tube. Type the month (1-12) and year. The checker compares it with today's date.", "inputs": [{"id": "expMonth", "label": "Expiry month (1-12), e.g. 03 = March", "value": 3}, {"id": "expYear", "label": "Expiry year, e.g. 2026", "value": 2026}], "formula": "if (!(expMonth >= 1 && expMonth <= 12) || !(expYear >= 2000 && expYear <= 2100)) return null;\nvar now = new Date();\nvar left = (expYear - now.getFullYear()) * 12 + (Math.round(expMonth) - (now.getMonth() + 1));\nif (left < 0) return {msg: '❌ DO NOT USE! This medicine expired ' + (-left) + ' month(s) ago. Give it to a pharmacy or PHC to throw away safely.', level: 'bad'};\nif (left <= 2) return {msg: '⚠️ Expires very soon (in about ' + left + ' month(s)). Check with a pharmacist before using.', level: 'warn'};\nreturn {msg: '✅ Not expired. About ' + left + ' months left. Still, take medicine only as the doctor said.', level: 'good'};", "result": "{msg}"}, {"type": "cards", "heading": "📋 Medicine Box Rules", "items": [{"icon": "🔍", "title": "Read EXP and MFG", "text": "EXP is the expiry date. MFG is the date it was made. Look for EXP.", "te": "EXP అంటే గడువు తేదీ. MFG అంటే తయారీ తేదీ."}, {"icon": "🧴", "title": "Opened tubes and drops", "text": "Eye drops and syrups may go bad sooner after opening. Read the label or ask the pharmacist.", "te": "తెరిచిన చుక్కల మందులు త్వరగా పాడవుతాయి. ఫార్మసిస్ట్‌ని అడగండి."}, {"icon": "🚫", "title": "Don't share medicines", "text": "Medicine given to one person is not for others.", "te": "ఒకరి మందులు ఇంకొకరు వాడకూడదు."}, {"icon": "🗑️", "title": "Throw away safely", "text": "Keep expired medicine away from children and ask the pharmacy or PHC how to dispose of it.", "te": "గడువు ముగిసిన మందులను పిల్లలకు దూరంగా ఉంచి, సురక్షితంగా పారవేయండి."}]}], "tools": ["Google Lens", "Gemini", "Canva"], "how": ["With an adult, empty the family medicine tin on a table.", "Open Google Lens and zoom in on the tiny EXP date on each strip or tube. Copy the text.", "Paste the dates into Gemini and ask which ones have passed today's date.", "Open Canva and make a big red 'DO NOT USE - EXPIRED' sticker and a green 'OK' sticker.", "Stick the right sticker on each medicine and separate the expired ones.", "Ask the pharmacy or PHC how to throw away expired medicines safely."], "prompt": "I am a Class 8 student. Here are the expiry dates from my family's medicine strips: [paste dates]. Today is [date]. Tell me in simple English and Telugu which ones are expired and must not be used, and how to throw them away safely. Don't give any dosage advice.", "category": "My Village & Street"};</script><script src="../assets/app.js"></script></body></html>
