": "bad"}, {"min": 0, "text": "No bad signs. Oil is OK — keep counting the uses.", "level": "good"}]}, {"type": "cards", "heading": "📋 Safe Frying Tips (FSSAI advice)", "items": [{"icon": "🔢", "title": "Count the uses", "text": "Use frying oil at most 2–3 times. Keep a tally on the kitchen wall.", "te": "వేయించిన నూనె 2–3 సార్ల కంటే ఎక్కువ వాడవద్దు."}, {"icon": "🧺", "title": "Filter and store", "text": "Filter used oil through a clean cloth and keep it covered.", "te": "వాడిన నూనెను గుడ్డతో వడకట్టి మూత పెట్టండి."}, {"icon": "🥘", "title": "Use leftover for curry", "text": "Slightly used oil is better for curries than for more deep frying, and use it up within 1–2 days.", "te": "కొంచెం వాడిన నూనెను కూరల్లో 1–2 రోజుల్లో వాడేయండి."}, {"icon": "🚫", "title": "Never top up", "text": "Do not mix fresh oil into old burnt oil.", "te": "పాత మాడిన నూనెలో కొత్త నూనె కలపవద్దు."}]}], "tools": ["Teachable Machine", "PictoBlox", "Gemini"], "how": ["With the mess cook's help, take a spoon of oil from each frying round and pour it into a small white bowl.", "In Teachable Machine, make 3 classes: Fresh, Used once or twice, Burnt. Take about 30 photos each in the same light.", "Train, Export and copy the model link into PictoBlox's Machine Learning extension.", "Make PictoBlox say the result in Telugu out loud for the cook.", "Stick a tally chart near the stove: one line every time the oil is used for frying.", "Ask Gemini for FSSAI tips on oil reuse and make a small poster for the kitchen."], "prompt": "I am a Class 8 student helping my hostel mess. In simple English and Telugu, explain how many times frying oil can be reused safely, the signs that it must be thrown away, and why burnt oil is bad for health. Keep it short for a kitchen poster.", "category": "My Hostel & School"};</script><script src="../assets/app.js"></script></body></html>
