<script>window.P={"id": 2, "emoji": "🧾", "title": "Reading the Tiny Numbers on Abba's Ration Receipt", "title_te": "అబ్బా రేషన్ రసీదులోని చిన్న అంకెలు చదవడం", "problem": "Abba squints at the faded paper printout from the ration shop, trying to figure out if we got the full rice quantity. He feels ashamed to ask others to read it for him.", "idea": "A receipt reader helper. We scan the bill with Google Lens, and Gemini reads out the rice kilos and price in Telugu. Here you can check if your family got the full rice quantity.", "widgets": [{"type": "calculator", "heading": "🧮 Try it: Did we get our full rice?", "intro": "Type the numbers from your ration card and receipt. The kilos per person can change, so check the latest amount at your ration shop or on your card.", "inputs": [{"id": "members", "label": "Family members on ration card", "value": 4}, {"id": "perPerson", "label": "Rice kilos per person (check your card)", "value": 6}, {"id": "received", "label": "Rice kilos written on receipt", "value": 20}], "formula": "if (!(members > 0) || !(perPerson > 0) || !(received >= 0)) return null;\nvar due = members * perPerson;\nvar diff = due - received;\nif (diff <= 0) return {due: due, received: received, msg: 'You got the full rice. Good!', level: 'good'};\nreturn {due: due, received: received, msg: 'You may be short by ' + diff + ' kg. Politely ask the dealer to check.', level: diff > 2 ? 'bad' : 'warn'};", "result": "Rice due: {due} kg\nRice on receipt: {received} kg\n{msg}"}, {"type": "cards", "heading": "📋 How to Read a Ration Receipt", "items": [{"icon": "🔢", "title": "Find the card number", "text": "Check that the card number on top is our own card.", "te": "పైన ఉన్న కార్డ్ నంబర్ మనదేనా చూడండి."}, {"icon": "🍚", "title": "Look for 'Rice' and 'Kg'", "text": "The number next to rice is the kilos we got.", "te": "బియ్యం పక్కన ఉన్న అంకె మనకు వచ్చిన కిలోలు."}, {"icon": "⚖️", "title": "Watch the weighing", "text": "Look at the weighing machine screen when rice is weighed.", "te": "బియ్యం తూకం వేసేటప్పుడు మెషీన్ స్క్రీన్ చూడండి."}, {"icon": "📞", "title": "Problem? Complain kindly", "text": "If rice is less, ask the dealer first, then tell the civil supplies office.", "te": "బియ్యం తక్కువ వస్తే, డీలర్‌ను అడగండి, తర్వాత పౌర సరఫరాల ఆఫీసుకు చెప్పండి."}]}], "tools": ["Google Lens", "Gemini"], "how": ["Keep the ration receipt flat in good light.", "Open Google Lens on the phone and tap Text to select all the words and numbers.", "Tap Copy, then open Gemini and paste the text.", "Ask Gemini to find the rice kilos and the price and explain them in simple Telugu.", "Tap the speaker button so Gemini reads the answer aloud for Abba.", "Check the kilos with the number on our ration card using the calculator above."], "prompt": "I am a Class 8 student. Here is the text from my father's ration shop receipt: [paste text]. Tell me in simple Telugu and English: how many kilos of rice we got, how many kilos of other items, and the total price. Keep it very short so I can read it aloud.", "category": "Inside My Own Home"};</script><script src="../assets/app.js"></script></body></html>
