<script>window.P={"id": 68, "emoji": "🥋", "title": "Self-Defense Stance Coach for Hostel Girls", "title_te": "హాస్టల్ అమ్మాయిలకు ఆత్మరక్షణ భంగిమ కోచ్", "problem": "Girls in our residential school want to learn physical self-defense moves, but we don't have a permanent sports trainer in our hostel.", "idea": "A pose coach. The webcam looks at how I am standing and tells me if my safe 'ready' stance is right. The most important lesson: shout, run to safety and call for help.", "widgets": [{"type": "picker", "heading": "🎯 Try it: What pose does the camera see?", "intro": "In my real project, Teachable Machine Pose checks my body position. Here, tap the pose to see the coach's feedback.", "question": "The camera sees me standing like this:", "options": [{"icon": "🧍‍♀️", "label": "Feet apart, hands up in front", "result": "Good ready stance! Balanced feet, hands protecting your face. Now say 'STOP!' loudly.", "te": "మంచి భంగిమ! కాళ్ళు విడిగా, చేతులు ముఖం ముందు. ఇప్పుడు గట్టిగా 'ఆపు!' అని అరవండి.", "level": "good"}, {"icon": "🚶‍♀️", "label": "Feet together, hands down", "result": "Easy to push over. Put one foot forward and lift your hands.", "te": "సులభంగా పడిపోతారు. ఒక కాలు ముందు పెట్టి చేతులు పైకెత్తండి.", "level": "bad"}, {"icon": "🙈", "label": "Eyes closed, turned away", "result": "Keep your eyes open and look for the way out to a safe place.", "te": "కళ్ళు తెరిచి సురక్షిత ప్రదేశానికి దారి చూడండి.", "level": "warn"}]}, {"type": "cards", "heading": "🛡️ The 4 Golden Safety Rules", "items": [{"icon": "👀", "title": "Be aware", "text": "Notice who is around. Trust your feeling if something is wrong.", "te": "చుట్టూ ఎవరున్నారో గమనించండి. ఏదో తప్పు అనిపిస్తే నమ్మండి."}, {"icon": "📣", "title": "Shout loudly", "text": "Shout 'NO! STOP! HELP!' A loud voice scares people away and brings help.", "te": "'వద్దు! ఆపు! సహాయం!' అని గట్టిగా అరవండి."}, {"icon": "🏃‍♀️", "title": "Run to safety", "text": "Run to the warden, a teacher, a shop or any place with people.", "te": "వార్డెన్, ట
