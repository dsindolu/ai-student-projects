<script>window.P={"id": 140, "emoji": "🎶", "title": "Telangana Folk Song Lyric & Meaning Cards", "title_te": "తెలంగాణ జానపద పాటల సాహిత్యం & అర్థం కార్డులు", "problem": "Old village folk songs sung at harvest time are being forgotten, because young students listen only to movie songs on mobile phones.", "idea": "I record my grandmother's folk songs, write each line with a simple meaning, and print pretty lyric cards. Learn about our folk song types and check your recording plan.", "widgets": [{"type": "cards", "heading": "🎵 Folk song types of Telangana", "items": [{"icon": "🌼", "title": "Bathukamma songs", "text": "Women sing in a circle around the flower Bathukamma, clapping together.", "te": "బతుకమ్మ చుట్టూ మహిళలు చప్పట్లు కొడుతూ పాడే పాటలు."}, {"icon": "🌾", "title": "Paddy planting songs", "text": "Women sing while planting paddy in the fields, to make hard work feel lighter.", "te": "నాట్లు వేసేటప్పుడు శ్రమ తెలియకుండా పాడే పాటలు."}, {"icon": "🥁", "title": "Oggu Katha", "text": "A storytelling song form with the small 'oggu' drum, telling stories of gods like Mallanna.", "te": "ఒగ్గు డోలుతో మల్లన్న వంటి దేవుళ్ళ కథలు పాడే కళ."}, {"icon": "🎻", "title": "Burra Katha", "text": "A main singer with a stringed instrument tells a story, with two helpers adding jokes and replies.", "te": "తంబురతో ప్రధాన కథకుడు, ఇద్దరు సహాయకులతో చెప్పే కథ."}, {"icon": "👶", "title": "Lullabies", "text": "Soft songs mothers and grandmothers sing to put babies to sleep.", "te": "పిల్లలను నిద్రపుచ్చడానికి పాడే జోల పాటలు."}]}, {"type": "checklist", "heading": "✅ My song recording plan", "intro": "Tick each step before you record.", "items": [{"text": "I asked Ammamma/Nanamma for permission to record.", "te": "రికార్డ్ చేయడానికి అమ్మమ్మ/నానమ్మ అనుమతి తీసుకున్నాను."}, {"text": "I chose a quiet place with no TV or fan noise.", "te": "టీవీ, ఫ్యాన్ శబ్దం లేని నిశ్శబ్ద చోటు ఎంచుకున్నాను."}, {"text": "I asked when and why this song is sung.", "te": "ఈ పాట ఎప్పుడు, ఎందుకు పాడతారో అడిగాను."}, {"text": "I wrote down the singer's name and village.", "te": "పాడినవారి పేరు, ఊరు రాసుకున్నాను."}, {"text": "I checked the meaning of each line with an elder.", "te": "ప్రతి లైన్ అర్థం పెద్దవాళ్ళతో సరిచూశాను."}], "bands": [{"min": 1, "text": "Ready to record! 🎙️", "level": "good"}, {"min": 0.6, "text": "Almost ready.", "level": "warn"}, {"min": 0, "text": "Plan a little more before recording.", "level": "bad"}]}, {"type": "quiz", "heading": "❓ Folk Song Quiz", "questions": [{"q": "Which songs are sung by women going around a tower of flowers?", "options": ["Bathukamma songs", "Movie songs", "Lullabies"], "answer": 0, "why": "Bathukamma songs are sung around the flower Bathukamma."}, {"q": "Oggu Katha is named after a…", "options": ["Small drum", "Flute", "Bird"], "answer": 0, "why": "The 'oggu' is a small drum used by the storytellers."}, {"q": "Why did farm workers sing while planting paddy?", "options": ["To scare birds", "To make hard work lighter and keep rhythm", "To call the rain"], "answer": 1, "why": "Singing together keeps rhythm and makes long work easier."}]}], "tools": ["Gemini", "Canva"], "how": ["Ask your grandmother to sing one harvest or Bathukamma song and record it on a phone.", "Play it slowly and write each line in Telugu in a notebook.", "Sit with her and ask the meaning of difficult words. Write them down.", "Type the lines into Gemini and ask for a simple one-line meaning for each line, in Telugu and English.", "Check Gemini's meanings with your grandmother and fix any mistakes.", "In Canva, make a lyric card with the song, meanings, and the singer's name and village. Print and share."], "prompt": "I am a Class 8 student. Here are the lines of a Telangana folk song my grandmother sang: [paste lines]. Give a simple one-line meaning for each line in Telugu and in English. If you are not sure of a word, say so instead of guessing.", "category": "Culture, Artisans & Village Pride"};</script><script src="../assets/app.js"></script></body></html>
