 "level": "good"}]}, {"type": "cards", "heading": "🌿 Low-Cost Organic Tips", "items": [{"icon": "🧪", "title": "Soil test first", "text": "A free soil health card tells what your soil really needs.", "te": "మట్టి ఆరోగ్య కార్డు మీ నేలకు ఏమి కావాలో చెబుతుంది."}, {"icon": "🐄", "title": "Farm manure", "text": "Well-rotted cow dung manure feeds soil slowly and safely.", "te": "బాగా కుళ్ళిన పశువుల ఎరువు నేలకు మంచిది."}, {"icon": "🌱", "title": "Green manure", "text": "Grow and plough in jeelugu (dhaincha) before planting paddy.", "te": "నాట్లు వేయక ముందు జీలుగ పెంచి దున్నండి."}, {"icon": "🚫", "title": "Don't over-use urea", "text": "Too much urea makes plants soft and invites pests.", "te": "ఎక్కువ యూరియా వేస్తే పురుగులు ఎక్కువ వస్తాయి."}]}, {"type": "quiz", "heading": "🧠 Quick Quiz", "questions": [{"q": "Paddy leaves are yellow. What is the best first step?", "options": ["Buy any costly fertilizer", "Find the real reason with the Agriculture Officer", "Pour more water"], "answer": 1, "why": "Yellow leaves have many reasons. The right reason saves money."}, {"q": "What gives free information about what our soil needs?", "options": ["Soil health card", "TV advert", "Neighbour's guess"], "answer": 0, "why": "A soil test and soil health card are given through the agriculture department."}, {"q": "Can extra water cure blast disease?", "options": ["Yes", "No"], "answer": 1, "why": "Blast is a fungus disease. It needs expert advice, not more water."}]}], "tools": ["Google Lens", "Gemini", "Canva"], "how": ["Take a clear photo of the yellow paddy leaf in daylight.", "Open Google Lens and search the photo to see similar pictures.", "Paste the photo into Gemini and use my prompt to list possible reasons.", "Ask Gemini to write organic, low-cost tips in simple Telugu.", "Make a one-page poster in Canva with photos of each problem.", "Show the poster to the Agriculture Officer to check it, then put it up at Rythu Vedika."], "prompt": "This is a photo of a yellow paddy leaf from a Tela
