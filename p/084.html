mber of person complaining", "te": "ఫిర్యాదు చేసే వారి పేరు, ఫోన్ నంబర్"}], "bands": [{"min": 1, "text": "Complete complaint! Send it now.", "level": "good"}, {"min": 0.5, "text": "Add the missing details so the office can act fast.", "level": "warn"}, {"min": 0, "text": "Too few details. The office may not find the pole.", "level": "bad"}]}], "tools": ["Google Lens", "Gemini"], "how": ["Use Google Lens to scan the paper grievance form from the Panchayat office and read it in Telugu.", "Walk the street with elders and list every broken light with landmarks.", "Ask Gemini to turn our notes into a short, polite complaint.", "Ask the Panchayat Secretary which official online or written method to use.", "Help elders send the complaint and save the complaint number.", "Make a small list on paper to track which lights got fixed."], "prompt": "I am a Class 8 student. Write a short, polite complaint (under 80 words) to the Gram Panchayat about a broken streetlight. Details: [street name, pole number / landmark, off since date, danger to children at night]. Give it in English and simple Telugu.", "category": "Government Papers & Office Help"};</script><script src="../assets/app.js"></script></body></html>
