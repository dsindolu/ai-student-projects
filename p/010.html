old her"], "answer": 1, "why": "A doctor can check her and guide the family."}]}], "tools": ["Teachable Machine", "PictoBlox", "Gemini"], "how": ["Ask each family member if they are okay to be in the project.", "Open Teachable Machine, choose Image Project, and make one class per person plus a 'Nobody' class.", "Take about 40 photos of each person's face from different sides.", "Click Train and Export, then load the model in PictoBlox.", "Add a block that says 'This is your nephew Ramesh!' in a soft Telugu voice for each class.", "Play it like a game with grandma and keep the photos private."], "prompt": "I am a Class 8 student making a memory game for my grandmother. Write kind, short Telugu and English sentences to introduce family members to her, like 'This is your nephew Ramesh from Nizamabad'. Also give 3 tips to help elders with memory problems feel respected.", "category": "Inside My Own Home"};</script><script src="../assets/app.js"></script></body></html>
