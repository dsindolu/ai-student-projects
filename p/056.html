<script>window.P={"id": 56, "emoji": "💡", "title": "Tracking Our 200-Unit Free Power Limit", "title_te": "మా 200 యూనిట్ల ఉచిత కరెంట్ పరిమితి లెక్క", "problem": "At home, we worry every month whether our meter reading will cross the 200-unit free electricity limit and bring a big bill.", "idea": "A meter calculator. We type the reading on bill day and today's reading. It predicts the units for the whole month and warns us early.", "widgets": [{"type": "calculator", "heading": "🧮 Try it: Will we cross the limit?", "intro": "Read the numbers on the electricity meter. The free limit is set by the government scheme – type the latest limit and confirm the rules at the electricity office or official website.", "inputs": [{"id": "startRead", "label": "Meter reading on last bill day", "value": 4520}, {"id": "todayRead", "label": "Meter reading today", "value": 4630}, {"id": "daysGone", "label": "Days since last bill", "value": 15}, {"id": "monthDays", "label": "Days in billing month", "value": 30}, {"id": "limit", "label": "Free units limit", "value": 200}], "formula": "var used = todayRead - startRead; if (used < 0 || daysGone <= 0 || monthDays <= 0 || limit <= 0) return null; var perDay = used / daysGone; var pred = Math.round(perDay * monthDays); var left = limit - used; var safeDay = (monthDays - daysGone) > 0 ? Math.max(0, left / (monthDays - daysGone)) : 0; var lvl = pred > limit ? 'bad' : (pred > limit * 0.9 ? 'warn' : 'good'); var msg = pred > limit ? 'Danger! You may cross the limit. Save power now!' : (pred > limit * 0.9 ? 'Very close! Be careful.' : 'Safe. Keep it up!'); return {used: used, perDay: perDay, pred: pred, safeDay: safeDay, msg: msg, level: lvl};", "result": "Used so far: {used} units ({perDay} units a day)\nPredicted for the month: {pred} units\nTo stay under the limit, use at most {safeDay} units a day\n{msg}"}, {"type": "checklist", "heading": "🌱 Power Saving Habits at Home", "intro": "Tick what your family already does.", "items": [{"text": "Switch off fans and lights when leaving the room", "te": "గదిలో నుండి వెళ్ళేటప్పుడు ఫ్యాన్, లైట్ ఆపుతాం"}, {"text": "Use LED bulbs", "te": "ఎల్ఈడీ బల్బులు వాడుతాం"}, {"text": "Switch off TV and charger at the plug", "te": "టీవీ, ఛార్జర్ ప్లగ్ దగ్గర ఆపుతాం"}, {"text": "Run the motor only when the tank is empty", "te": "ట్యాంక్ ఖాళీ అయినప్పుడే మోటార్ వేస్తాం"}, {"text": "Use the fridge door less often", "te": "ఫ్రిజ్ తలుపు తక్కువసార్లు తెరుస్తాం"}, {"text": "Use daylight instead of lights in the day", "te": "పగలు లైట్‌కు బదులు సూర్యకాంతి వాడుతాం"}], "bands": [{"min": 0.8, "text": "Power saving superstar family!", "level": "good"}, {"min": 0.5, "text": "Good! Add 1-2 more habits.", "level": "warn"}, {"min": 0, "text": "Start small: switch off when you leave a room.", "level": "bad"}]}, {"type": "quiz", "heading": "🧠 Quick Quiz", "questions": [{"q": "Reading today 4,630, last bill 4,520. Units used?", "options": ["110", "9,150", "4,630"], "answer": 0, "why": "Today's reading − last reading = units used."}, {"q": "Which bulb saves the most power?", "options": ["Old yellow bulb", "LED bulb"], "answer": 1, "why": "LED bulbs use much less electricity."}, {"q": "Where should we confirm the free power rules?", "options": ["Electricity office / official website", "Rumours"], "answer": 0, "why": "Scheme rules can change, so check official sources."}]}], "tools": ["Scratch", "Gemini"], "how": ["Learn to read our electricity meter with Abba and write the reading every Sunday.", "In Scratch, make variables: start reading, today reading, days.", "Set used = today − start, perDay = used ÷ days, predicted = perDay × 30.", "If predicted > 200, make the sprite turn red and say 'Save power!'.", "Ask Gemini for 10 simple power saving tips in Telugu and show one each time.", "Use it every week for 2 months and check if the bill stays under the limit."], "prompt": "I am a Class 8 student. Explain in simple English and Telugu how a family can read their electricity meter, calculate units used so far, and predict the month's total to stay under a 200-unit free limit. Give 8 easy power-saving tips for a village home and remind them to check the latest scheme rules at the electricity office.", "category": "Money Worries & Scams"};</script><script src="../assets/app.js"></script></body></html>
