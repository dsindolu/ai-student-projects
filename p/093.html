<script>window.P={"id": 93, "emoji": "🌧️", "title": "Rainwater Harvesting Pit Calculator for Village Houses", "title_te": "గ్రామ ఇళ్ళ కోసం వాననీటి ఇంకుడు గుంత కాలిక్యులేటర్", "problem": "Heavy monsoon rain flows away into muddy street drains, while our open house wells go completely dry in the summer months.", "idea": "A rain calculator. Enter your roof size and it tells how many litres of rain your roof can catch in a year, and a simple pit size to send that water back into the ground.", "widgets": [{"type": "calculator", "heading": "🧮 Try it: How much rain can my roof catch?", "intro": "Measure your roof with a tape (length × width in metres). Telangana gets about 800–900 mm of rain in a year.", "inputs": [{"id": "length", "label": "Roof length (metres)", "value": 8}, {"id": "width", "label": "Roof width (metres)", "value": 6}, {"id": "rain", "label": "Rainfall in one year (mm)", "value": 850}], "formula": "if (!(length > 0 && width > 0 && rain > 0)) return null; var area = length * width; var litres = area * rain * 0.8; var stormM3 = area * 0.05 * 0.8; var depth = Math.min(3, Math.max(1, stormM3 / 2.25)); return {area: area, litres: Math.round(litres), buckets: Math.round(litres / 15), pit: '1.5 m × 1.5 m × ' + depth.toFixed(1) + ' m deep', level: 'good'};", "result": "Roof area: {area} sq. metres\nRain caught in a year: about {litres} litres (≈ {buckets} buckets!)\nSuggested recharge pit: {pit}\nFill it with big stones at the bottom, then gravel, then sand on top."}, {"type": "steps", "heading": "🛠️ How to make a recharge pit", "items": [{"title": "Choose a spot", "text": "Dig at least 3 metres away from the house wall and away from toilets.", "te": "ఇంటి గోడ, మరుగుదొడ్డి నుండి 3 మీటర్ల దూరంలో గుంత తవ్వండి."}, {"title": "Dig the pit", "text": "Dig the size the calculator gives. Elders should do the digging.", "te": "కాలిక్యులేటర్ చెప్పిన సైజులో పెద్దవాళ్ళు గుంత తవ్వాలి."}, {"title": "Fill in layers", "text": "Big stones at the bottom, small gravel in the middle, coarse sand on top.", "te": "అడుగున పెద్ద రాళ్ళు, మధ్యలో కంకర, పైన ఇసుక వేయండి."}, {"title": "Connect the pipe", "text": "Bring the roof pipe to the pit. Keep a net to stop leaves.", "te": "పైకప్పు పైపును గుంతకు కలపండి. ఆకులు రాకుండా జాలీ పెట్టండి."}, {"title": "Cover and clean", "text": "Cover the pit so children cannot fall in. Clean the sand layer before every monsoon.", "te": "పిల్లలు పడకుండా గుంత మూయండి. ప్రతి వర్షాకాలం ముందు శుభ్రం చేయండి."}]}], "tools": ["Scratch", "Gemini", "Canva"], "how": ["Measure the length and width of your roof with a measuring tape.", "In Scratch, make 3 variables: length, width, rain. Use 'ask and wait' blocks to get the numbers.", "Calculate litres = length × width × rain × 0.8 and show it with a 'say' block.", "Add a simple pit size suggestion using an 'if' block for small and big roofs.", "Ask Gemini to check your steps for making a recharge pit in simple words.", "Make a poster in Canva with your roof's result and show it to the Gram Panchayat."], "prompt": "I am a Class 8 student in a Telangana village. Explain in simple steps how to make a low-cost rainwater recharge pit for a house roof of about 50 square metres, with stones, gravel and sand layers. Use short sentences.", "category": "Clean Water, Soil & Air"};</script><script src="../assets/app.js"></script></body></html>
