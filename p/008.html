our poison into a water or oil bottle.", "te": "విషాన్ని నీళ్ళ లేదా నూనె సీసాలో పోయవద్దు."}, {"icon": "🚑", "title": "If swallowed, call 108", "text": "Go to the hospital at once and take the bottle with you. Don't wait.", "te": "మింగితే వెంటనే 108కి ఫోన్ చేసి, సీసాతో ఆసుపత్రికి వెళ్ళండి."}]}], "tools": ["Google Lens", "Gemini", "Canva"], "how": ["With an adult, collect the poison bottles at home (sprays, rat poison, cleaners).", "Open Google Lens, point at each label and copy the name and warning words.", "Paste into Gemini and ask for a short, simple warning in Telugu and English.", "Open Canva, search 'warning sticker', and add a big skull, a STOP hand and the warning words.", "Print the stickers, stick them on the bottles, and keep the bottles high up.", "Teach your cousin: skull shape means DON'T TOUCH."], "prompt": "I am a Class 8 student. Here is the text from a pest-control bottle label: [paste text]. Write a very short warning sticker message in simple Telugu and English for small children, like 'POISON - DON'T TOUCH'. Do not use colours as the only warning.", "category": "Inside My Own Home"};</script><script src="../assets/app.js"></script></body></html>
