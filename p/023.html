<script>window.P={"id": 23, "emoji": "🤒", "title": "Home Sick-Room Setup Poster for Viral Fevers", "title_te": "వైరల్ జ్వరాలకు ఇంట్లో జాగ్రత్తల పోస్టర్", "problem": "When one person in our small single-room house gets a viral flu, everyone else catches it within two days because we share drinking glasses.", "idea": "A simple home hygiene poster so flu doesn't spread to everyone, even in a small house. Here you can check how well your family is stopping the spread.", "widgets": [{"type": "checklist", "heading": "✅ Is Our Home Stopping the Flu?", "intro": "Someone at home has fever. Tick what your family is doing.", "items": [{"text": "The sick person has their own glass, plate and towel", "te": "జబ్బు ఉన్నవారికి వేరే గ్లాసు, ప్లేటు, తువ్వాలు"}, {"text": "The sick person sleeps a little apart, near a window", "te": "జబ్బు ఉన్నవారు కిటికీ దగ్గర కొంచెం దూరంగా పడుకుంటారు"}, {"text": "Door and window are open for fresh air", "te": "గాలి కోసం తలుపు, కిటికీ తెరిచి ఉన్నాయి"}, {"text": "Everyone washes hands with soap often", "te": "అందరూ సబ్బుతో తరచూ చేతులు కడుగుతున్నారు"}, {"text": "The sick person covers coughs with a cloth or elbow", "te": "దగ్గినప్పుడు గుడ్డ లేదా మోచేయి అడ్డు పెడుతున్నారు"}, {"text": "The sick person drinks plenty of water and rests", "te": "ఎక్కువ నీళ్ళు తాగి విశ్రాంతి తీసుకుంటున్నారు"}, {"text": "We will go to the PHC if fever lasts more than 2-3 days or is very high", "te": "జ్వరం 2-3 రోజులు దాటితే లేదా బాగా ఎక్కువైతే పీహెచ్‌సీకి వెళ్తాము"}], "bands": [{"min": 0.85, "text": "Super family! The flu will find it hard to spread.", "level": "good"}, {"min": 0.5, "text": "Good! A few more steps will protect everyone.", "level": "warn"}, {"min": 0, "text": "The flu can spread fast. Start with separate glasses today.", "level": "bad"}]}, {"type": "cards", "heading": "🚨 Go to the Doctor at Once If...", "items": [{"icon": "😮‍💨", "title": "Breathing is hard", "text": "Fast or difficult breathing needs a doctor now. Call 108 if serious.", "te": "శ్వాస కష్టంగా ఉంటే వెంటనే డాక్టర్. తీవ్రమైతే 108."}, {"icon": "🔴", "title": "Red spots or bleeding", "text": "Rashes, bleeding gums or black stools need urgent care.", "te": "ఎర్ర మచ్చలు, చిగుళ్ళ నుంచి రక్తం వస్తే వెంటనే ఆసుపత్రి."}, {"icon": "👶", "title": "Babies, elders, pregnant women", "text": "They should see a doctor early, even for a small fever.", "te": "పసిపిల్లలు, పెద్దలు, గర్భిణీలు త్వరగా డాక్టర్‌ని కలవాలి."}, {"icon": "💊", "title": "No self-medicine", "text": "Don't take leftover tablets. Take only what the doctor gives.", "te": "మిగిలిన మాత్రలు వేసుకోవద్దు. డాక్టర్ ఇచ్చినవి మాత్రమే."}]}], "tools": ["Gemini", "Canva"], "how": ["Ask Gemini for simple home rules to stop flu spreading in a small one-room house.", "Check the rules with the ASHA worker or PHC nurse.", "Open Canva and search for a 'health poster' template.", "Add big pictures: separate glass, hand washing, open window, covering cough.", "Write each rule in big Telugu and English words.", "Print the poster and stick it on the wall at home and in our street."], "prompt": "I am a Class 8 student. My family lives in a small one-room house. Give 7 simple rules in English and Telugu to stop a viral fever spreading to everyone at home, and the danger signs when we must go to a doctor.", "category": "My Village & Street"};</script><script src="../assets/app.js"></script></body></html>
