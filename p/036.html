<script>window.P={"id": 36, "emoji": "⚖️", "title": "Checking Fair Market Rates for Paddy Bags", "title_te": "వరి బస్తాలకు సరైన ధర తనిఖీ", "problem": "Middlemen visit our village and pressure farmers to sell grain bags at cheap prices, claiming market rates in town have fallen down.", "idea": "A price checker. The farmer types the number of bags, bag weight, the official support price and the middleman's offer. It shows how much money he would lose.", "widgets": [{"type": "calculator", "heading": "🧮 Try it: Am I getting a fair price?", "intro": "The government Minimum Support Price (MSP) is given per quintal (100 kg). Type the latest MSP from the official notice or the paddy procurement centre. The default is only an example.", "inputs": [{"id": "bags", "label": "Number of bags", "value": 50}, {"id": "kgPerBag", "label": "Weight of one bag (kg)", "value": 40}, {"id": "msp", "label": "Official MSP per quintal (₹)", "value": 2369}, {"id": "offer", "label": "Middleman's offer per quintal (₹)", "value": 1900}], "formula": "if (bags <= 0 || kgPerBag <= 0 || msp <= 0 || offer <= 0) return null; var q = bags * kgPerBag / 100; var fair = q * msp; var got = q * offer; var loss = fair - got; return {q: q, fair: Math.round(fair), got: Math.round(got), loss: Math.round(Math.abs(loss)), msg: loss > 0 ? 'You LOSE' : 'Offer is fair or better. You gain', level: loss > 0 ? 'bad' : 'good'};", "result": "Total paddy = {q} quintals\nAt MSP: ₹{fair}\nMiddleman pays: ₹{got}\n{msg} ₹{loss}"}, {"type": "cards", "heading": "📢 Daily Price Flyer Tips", "items": [{"icon": "🏛️", "title": "Know the MSP", "text": "The government announces MSP for paddy every season. Check it at the procurement centre or official website.", "te": "ప్రతి సీజన్ ప్రభుత్వం కనీస మద్దతు ధర ప్రకటిస్తుంది."}, {"icon": "🏪", "title": "Sell at the IKP / PACS centre", "text": "Government paddy purchase centres buy at MSP when grain meets quality rules.", "te": "ప్రభుత్వ కొనుగోలు కేంద్రాల్లో మద్దతు ధరకు అమ్మండి."}, {"icon": "☀️", "title": "Dry the grain well", "text": "Dry, clean paddy gets the full price. Wet grain gets cut.", "te": "బాగా ఆరబెట్టిన ధాన్యానికి పూర్తి ధర వస్తుంది."}, {"icon": "🧾", "title": "Take a receipt", "text": "Always ask for a written slip with weight and rate.", "te": "బరువు, ధరతో రసీదు తప్పకుండా తీసుకోండి."}]}, {"type": "quiz", "heading": "🧠 Quick Quiz", "questions": [{"q": "How many kg in one quintal?", "options": ["10 kg", "100 kg", "1000 kg"], "answer": 1, "why": "1 quintal = 100 kg."}, {"q": "A middleman says 'town rates fell, sell to me now'. What do you do first?", "options": ["Sell quickly", "Check the official MSP and centre rate"], "answer": 1, "why": "Always check the official rate before selling."}, {"q": "Why should paddy be dried well before selling?", "options": ["Wet grain gets a lower price", "It looks nice"], "answer": 0, "why": "Procurement centres check moisture. Dry grain gets the full price."}]}], "tools": ["Gemini", "Canva"], "how": ["Find this season's official paddy MSP on the government notice or ask the procurement centre.", "Ask Gemini to make a simple table: bags × kg ÷ 100 = quintals, then quintals × MSP.", "Make 3 example sums for 20, 50 and 100 bags.", "Open Canva and choose a flyer template. Add the MSP, example table and centre address.", "Write the main lines in Telugu with Gemini's help.", "Print the flyer and stick it at the Gram Panchayat and Rythu Vedika."], "prompt": "I am a Class 8 student in a Telangana village. Help me make a simple price flyer in English and Telugu. Explain quintals (1 quintal = 100 kg), show how to calculate the total money for paddy bags at the official MSP, and give 4 tips to avoid being cheated by middlemen. Leave a blank for this season's MSP so I can fill the official number.", "category": "Our Fields, Cattle & Kirana Shops"};</script><script src="../assets/app.js"></script></body></html>
