ా."}, {"title": "Accident details", "text": "Date, place and how the accident happened. Keep it short and true.", "te": "ప్రమాదం జరిగిన తేదీ, స్థలం, ఎలా జరిగిందో క్లుప్తంగా రాయండి."}, {"title": "Nominee / claimant", "text": "The person who will receive the money, with bank details.", "te": "డబ్బు పొందే వ్యక్తి పేరు, బ్యాంక్ వివరాలు."}, {"title": "Sign and submit", "text": "Sign, attach copies, submit at the bank and keep the receipt.", "te": "సంతకం చేసి, కాపీలు జతచేసి, బ్యాంకులో ఇచ్చి రసీదు తీసుకోండి."}]}, {"type": "quiz", "heading": "🧠 Quick Quiz", "questions": [{"q": "Should we pay an agent to get a government insurance claim?", "options": ["Yes", "No, the bank helps for free"], "answer": 1, "why": "Claim forms are free. Bank staff and the insurance office help."}, {"q": "What should we take after submitting the form?", "options": ["A receipt / acknowledgement", "Nothing"], "answer": 0, "why": "The receipt proves you submitted on time."}, {"q": "Why should we apply quickly?", "options": ["Claims have time limits", "No reason"], "answer": 0, "why": "Late claims can be rejected. Apply soon."}]}], "tools": ["Google Lens", "Gemini", "Canva"], "how": ["Get a blank claim form from the bank and take a clear photo.", "Use Google Lens 'Translate' to see the form in Telugu.", "Ask Gemini to explain each section of the form in one simple Telugu line.", "Make a list of needed papers with Gemini and check it with the bank staff.", "Design a 2-page help sheet in Canva: form picture with numbered boxes + Telugu meaning.", "Print copies and keep them at the Gram Panchayat office."], "prompt": "I am a Class 8 student. Here is a photo of a government accident insurance claim form. Explain each section in one simple line in Telugu and English, list the usual documents needed, and remind families that claim forms are free and to confirm details with the bank.", "category": "Money Worries & Scams"};</script><script src="../assets/app.js"></script></body></html>
