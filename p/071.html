<script>window.P={"id": 71, "emoji": "📐", "title": "Tailoring Cloth Cutting Measurement Calculator", "title_te": "కుట్టుపని బట్ట కత్తిరింపు కొలతల కాలిక్యులేటర్", "problem": "Beginner tailors waste expensive saree cloth because of wrong paper pattern measurements before cutting the fabric.", "idea": "A cloth calculator. The tailor types the dress measurements and the cloth width, and it tells her roughly how much cloth she needs and whether the front and back pieces fit side by side.", "widgets": [{"type": "calculator", "heading": "🧮 How Much Cloth Do I Need? (simple kurta / frock)", "intro": "This is a rough beginner estimate. Always make a paper pattern and check it on the cloth before cutting.", "inputs": [{"id": "chest", "label": "Chest round (cm)", "value": 86}, {"id": "length", "label": "Dress length (cm)", "value": 90}, {"id": "sleeve", "label": "Sleeve length (cm, 0 for sleeveless)", "value": 20}, {"id": "width", "label": "Cloth width", "type": "select", "value": "110", "options": [{"label": "90 cm (narrow)", "value": "90"}, {"label": "110 cm (medium)", "value": "110"}, {"label": "140 cm (wide)", "value": "140"}]}], "formula": "if ([chest, length, sleeve, width].some(function(x){return typeof x !== 'number' || x < 0;}) || chest <= 0 || length <= 0) return null; var panel = chest / 2 + 8; var side = 2 * panel <= width; var body = side ? (length + 8) : 2 * (length + 8); var sl = 0; if (sleeve > 0) { var sw = chest / 3 + 6; sl = (2 * sw <= width) ? (sleeve + 6) : 2 * (sleeve + 6); } var cm = (body + sl) * 1.1; var m = Math.ceil(cm / 10) / 10; return {panel: Math.round(panel), layout: side ? 'Front and back fit SIDE BY SIDE – saves cloth!' : 'Cloth is too narrow – cut front and back ONE BELOW THE OTHER.', metres: m, level: side ? 'good' : 'warn'};", "result": "Each body piece width (with seam allowance): about {panel} cm\n{layout}\nCloth to buy (with 10% extra for safety): about {metres} metres"}, {"type": "steps", "heading": "✂️ Cut Without Wasting Cloth", "items": [{"title": "Measure twice", "text": "Measure the person twice and write the numbers down.", "te": "రెండు సార్లు కొలిచి నంబర్లు రాసుకోండి."}, {"title": "Paper pattern", "text": "Draw the pattern on old newspaper first.", "te": "ముందు పాత పేపర్ మీద ప్యాటర్న్ గీయండి."}, {"title": "Fold the cloth", "text": "Fold the cloth in half lengthwise so both sides match.", "te": "రెండు వైపులా సమానంగా ఉండేలా బట్టను సగానికి మడవండి."}, {"title": "Arrange pieces", "text": "Place all paper pieces on the cloth close together before cutting even one.", "te": "కత్తిరించే ముందు అన్ని ముక్కలను దగ్గరగా అమర్చండి."}, {"title": "Pin and cut", "text": "Pin the paper, mark with chalk, then cut slowly.", "te": "పిన్నులు పెట్టి, చాక్‌తో గీసి, నెమ్మదిగా కత్తిరించండి."}]}], "tools": ["Scratch", "Gemini"], "how": ["Ask a tailor aunty how she plans cloth for a simple kurta: body pieces, sleeves and extra for seams.", "Ask Gemini to explain the simple rule: if two body pieces fit across the cloth width, cut them side by side.", "Open Scratch and make variables: chest, length, sleeve, cloth width.", "Use 'ask and wait' blocks to get each measurement from the user.", "Use 'if…else' blocks to check if 2 pieces fit across the width, and calculate the total cloth length.", "Make the sprite say the answer in metres, and test it with the aunty's real measurements."], "prompt": "I am a Class 8 student making a Scratch calculator for beginner tailors. Explain in simple steps how to estimate cloth length for a simple kurta from chest, length, sleeve length and cloth width, including seam allowance. Use simple English and Telugu.", "category": "Helping Mother, Sisters & Village Women"};</script><script src="../assets/app.js"></script></body></html>
